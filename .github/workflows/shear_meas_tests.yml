name: shear-meas-tests

on:
  push:
    branches:
      - master
  # turned on temporarily to debug this workflow
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shear-meas-tests:
    name: shear-meas-tests
    strategy:
      matrix:
        pyver: ["3.12"]

    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v5

      - name: get catsim data
        shell: bash -l {0}
        env:
          CATSIM_URL: https://github.com/LSSTDESC/descwl-shear-sims/releases/download/catsim-data-v1/catsim.tar.gz
          CATSIM_SHA256: 97306c8251072f44408720f32e8d3bdab45fa54259070003347369c9fcc5be99
        run: |
          cd "$RUNNER_TEMP"
          wget -q "$CATSIM_URL"
          echo "$CATSIM_SHA256  catsim.tar.gz" | sha256sum -c -
          tar xfz catsim.tar.gz
          echo "CATSIM_DIR=$RUNNER_TEMP/catsim" >> "$GITHUB_ENV"

      - uses: conda-incubator/setup-miniconda@v3.2.0
        with:
          python-version: ${{ matrix.pyver }}
          channels: conda-forge
          channel-priority: strict
          show-channel-urls: true
          miniforge-version: latest

      - name: configure conda and install code
        shell: bash -l {0}
        run: |
          conda config --set always_yes yes

          conda install -q --file requirements.txt
          conda install -q \
            flake8 \
            pytest \
            fitsio \
            meds \
            ngmix \
            tqdm \
            joblib

          pip install --no-deps -e .

          # for now we always pull the latest of these packages
          pushd ..
          git clone https://github.com/LSSTDESC/descwl_coadd.git
          pushd descwl_coadd
          pip install --no-deps -e .
          popd
          popd

          pushd ..
          git clone https://github.com/esheldon/metadetect.git
          pushd metadetect
          pip install --no-deps -e .
          popd
          popd

      - name: fast test
        shell: bash -l {0}
        run: |
          pytest -vvsx shear_meas_tests/test_shear_meas.py -k test_shear_meas[grid-500]

      - name: slow test
        if: ${{ success() && github.event_name == 'push' }}
        shell: bash -l {0}
        run: |
          pytest -vvsx shear_meas_tests/test_shear_meas.py -k test_shear_meas[random-2500]
