name: tests

on:
  push:
    branches:
      - master
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    strategy:
      matrix:
        pyver: ["3.12"]

    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v5

      - name: get catsim data
        shell: bash -l {0}
        env:
          CATSIM_URL: https://github.com/LSSTDESC/descwl-shear-sims/releases/download/catsim-data-v1/catsim.tar.gz
          CATSIM_SHA256: 97306c8251072f44408720f32e8d3bdab45fa54259070003347369c9fcc5be99
        run: |
          cd "$RUNNER_TEMP"
          wget -q "$CATSIM_URL"
          echo "$CATSIM_SHA256  catsim.tar.gz" | sha256sum -c -
          tar xfz catsim.tar.gz
          echo "CATSIM_DIR=$RUNNER_TEMP/catsim" >> "$GITHUB_ENV"

      - uses: conda-incubator/setup-miniconda@v3.2.0
        with:
          python-version: ${{ matrix.pyver }}
          channels: conda-forge
          channel-priority: strict
          show-channel-urls: true
          miniforge-version: latest          

      - name: configure conda and install code
        shell: bash -l {0}
        run: |
          conda config --set always_yes yes

          mamba install -q --file requirements.txt
          conda install -q \
            flake8 \
            pytest \
            fitsio \
            ngmix

          pip install --no-deps -e .

      - name: env and package versions
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: lint
        shell: bash -l {0}
        run: |
          flake8 descwl_shear_sims

      - name: test
        shell: bash -l {0}
        run: |
          pytest -vv --ignore descwl_shear_sims/tests/test_correlated_noise.py descwl_shear_sims
